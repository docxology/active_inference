name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Every job syncs the locked environment once; later `uv run` calls reuse it.
  UV_NO_SYNC: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --extra dev --extra test --extra docs

    - name: black
      run: uv run black --check src/ tests/ scripts/check_ratchets.py

    - name: isort
      run: uv run isort --check-only src/ tests/ scripts/check_ratchets.py

    - name: flake8
      run: uv run flake8 src/ tests/ scripts/check_ratchets.py

    - name: mypy
      run: uv run mypy src/

    # Modules still exempt from strict typing are pinned in pyproject.toml
    # ([tool.active_inference.ratchets]): the list may only shrink and each
    # module's error count must match its budget exactly.
    - name: mypy legacy-module ratchet
      run: uv run python scripts/check_ratchets.py mypy

    # The documentation build must emit exactly the budgeted warning count.
    - name: Sphinx warning ratchet
      run: uv run python scripts/check_ratchets.py sphinx

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --extra dev --extra test

    # One run covers unit, integration, knowledge, performance and security
    # tests. AGENTS.md requires >80% overall and >95% for core components;
    # tests/coverage_config.py holds the per-component thresholds and the
    # overall ratchet that --cov-fail-under repeats here.
    - name: pytest
      run: uv run python -m pytest tests/ --cov=src/active_inference --cov-report=xml --cov-report=json --cov-report=term --cov-fail-under=99

    - name: Per-component coverage thresholds
      run: uv run python scripts/check_ratchets.py coverage coverage.json

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # codecov/codecov-action@v7.1.1
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --extra dev --extra test

    - name: Run security tests
      run: uv run python -m pytest tests/security/

    # Audit the exact locked dependency set (all extras, hash-pinned) rather
    # than whatever happens to be installed on the runner.
    - name: Dependency vulnerability scan
      run: |
        uv export --locked --all-extras --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
        uvx pip-audit --disable-pip --require-hashes --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"

  documentation:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --extra dev --extra docs

    - name: Build documentation
      run: uv run sphinx-build -q -b html docs/ docs/_build/

    - name: Deploy documentation
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build/
